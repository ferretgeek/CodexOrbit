name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64
          vs-version: "[17.0,18.0)"

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Verify tag matches binary version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $exe = Get-Item ./src/CodexOrbit/bin/x64/Release/CodexOrbit.exe
          $fileVersion = [Version]$exe.VersionInfo.FileVersion
          $expected = 'v{0}.{1}.{2}' -f `
            $fileVersion.Major, $fileVersion.Minor, $fileVersion.Build
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match binary version $expected."
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodexOrbit-release-${{ github.ref_name }}
          path: |
            artifacts/CodexOrbit-*-windows-x64.exe
            artifacts/CodexOrbit-*-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/CodexOrbit-*-windows-x64.exe
            artifacts/CodexOrbit-*-windows-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            (Get-ChildItem ./artifacts/CodexOrbit-*-windows-x64.exe).FullName
            (Get-ChildItem ./artifacts/CodexOrbit-*-windows-x64.zip).FullName
            (Resolve-Path ./artifacts/SHA256SUMS.txt).Path
          )
          $notes = "./docs/releases/$($env:RELEASE_TAG).md"
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets for $($env:RELEASE_TAG)."
            }
            if (Test-Path -LiteralPath $notes) {
              gh release edit $env:RELEASE_TAG `
                --title "Codex Orbit $($env:RELEASE_TAG)" `
                --notes-file $notes
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to update release notes for $($env:RELEASE_TAG)."
              }
            }
          } elseif (Test-Path -LiteralPath $notes) {
            gh release create $env:RELEASE_TAG @assets `
              --verify-tag `
              --title "Codex Orbit $($env:RELEASE_TAG)" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $($env:RELEASE_TAG)."
            }
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --verify-tag `
              --title "Codex Orbit $($env:RELEASE_TAG)" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $($env:RELEASE_TAG)."
            }
          }
